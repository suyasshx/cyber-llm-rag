services:
  - type: web
    name: cyberllm-rag-api
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn src.serving.fastapi_app:app --host 0.0.0.0 --port $PORT
    plan: free
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: LLM_PROVIDER
        value: groq
      - key: GROQ_API_KEY
        sync: false
